name: Ladybird GTK Arch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    env:
      CCACHE_DIR: /tmp/ccache
      BUILD_PRESET: Release

    steps:
      - name: Update Arch
        run: |
          pacman -Syu --noconfirm

      - name: Install Dependencies
        run: |
          pacman -S --needed --noconfirm \
            autoconf-archive \
            base-devel \
            bison \
            ccache \
            cmake \
            curl \
            git \
            less \
            libgl \
            libpulse \
            nasm \
            ninja \
            python \
            qt6-base \
            qt6-tools \
            rust \
            sudo \
            tar \
            unzip \
            zip \
            vulkan-headers \
            vulkan-icd-loader

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark Workspace Safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Builder User
        run: |
          useradd -m -s /bin/bash builder

          chown -R builder:builder "$GITHUB_WORKSPACE"

          mkdir -p /tmp/ccache
          chown -R builder:builder /tmp/ccache

          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Build Ladybird GTK
        continue-on-error: true
        run: |
          sudo -u builder bash -c "
            cd '$GITHUB_WORKSPACE'
            git config --global --add safe.directory '$GITHUB_WORKSPACE'
            python Meta/ladybird.py build --gui Gtk
          "

      - name: Upload GTK Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-logs
          path: |
            Build/vcpkg/buildtrees/gtk/*.log
            Build/release/vcpkg-manifest-install.log

      - name: Package Build
        if: success()
        run: |
          mkdir package
          cp -r Build/release/bin package/

          if [ -d Base/res ]; then
            cp -r Base/res package/
          fi

          tar -czf ladybird-gtk-arch.tar.gz package

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-gtk-arch
          path: ladybird-gtk-arch.tar.gz
